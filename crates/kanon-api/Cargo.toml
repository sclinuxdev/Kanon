[package]
name = "kanon-api"
version = "0.1.0"
edition = "2024"
description = "Decoupled RESTful API and WebSocket gateway for Kanon"

[dependencies]
kanon-core = { path = "../kanon-core" }
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
