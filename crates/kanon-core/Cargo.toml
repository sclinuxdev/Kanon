[package]
name = "kanon-core"
version = "0.1.0"
edition = "2024"
description = "Microkernel engine, pipeline router, and process supervisor for Kanon"

[dependencies]
kanon-proto = { path = "../kanon-proto" }
kanon-transport = { path = "../kanon-transport" }
kanon-storage = { path = "../kanon-storage" }
kanon-llm = { path = "../kanon-llm" }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.12"
axum = "0.7"
