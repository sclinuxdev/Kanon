[package]
name = "kanon-dev"
version = "0.1.0"
edition = "2024"
description = "CLI tool for Kanon plugin project management, scaffolding, and testing"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
